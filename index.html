<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Invitación de Boda</title>

  <!-- FUENTE ELEGANTE -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      margin: 0;
      background: #f8f4f0;
      color: #333;
      overflow-x: hidden;
      animation: fondoFlotando 20s infinite alternate ease-in-out;
    }

    @keyframes fondoFlotando {
      0% { background-position: 0 0; }
      100% { background-position: 0 10px; }
    }

    /* ANIMACIÓN FADE-IN */
    .fade {
      opacity: 0;
      transform: translateY(20px);
      animation: fadeIn 1.2s forwards;
    }
    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    header {
      background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('https://images.unsplash.com/photo-1529634806980-79d3f15d6e2c') center/cover;
      padding: 120px 20px;
      text-align: center;
      color: white;
      position: relative;
      overflow: hidden;
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 3.6rem;
      letter-spacing: 3px;
      margin: 0;
      animation: fadeIn 1.8s forwards;
    }

    header p {
      font-size: 1.4rem;
      margin-top: 20px;
      font-style: italic;
      opacity: 0;
      animation: fadeIn 2.6s forwards;
    }

    /* BRILLITOS FLOTANDO */
    .sparkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: white;
      border-radius: 50%;
      opacity: 0.7;
      animation: floatSparkle 6s infinite ease-in-out;
    }
    @keyframes floatSparkle {
      0% { transform: translateY(0); opacity: 0.6; }
      50% { opacity: 1; }
      100% { transform: translateY(-40px); opacity: 0.3; }
    }

    section {
      max-width: 650px;
      margin: 40px auto;
      background: rgba(255,255,255,0.85);
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      backdrop-filter: blur(4px);
    }

    h2 {
      font-family: 'Cinzel', serif;
      text-align: center;
      margin-bottom: 20px;
      color: #6a4e3c;
      font-size: 2rem;
    }

    /* IMÁGENES DECORATIVAS */
    .fotoDecor {
      width: 230px;
      border-radius: 15px;
      box-shadow: 0 5px 18px rgba(0,0,0,0.15);
      margin: 20px auto;
      display: block;
      animation: flotando 4s ease-in-out infinite;
    }
    @keyframes flotando {
      0% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
      100% { transform: translateY(0); }
    }

    input, select, textarea {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 1rem;
    }

    button {
      padding: 14px;
      background: #6a4e3c;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    button:hover {
      background: #8b6a52;
      transform: scale(1.03);
    }

    /* ANIMACIÓN LATIDO */
    @keyframes latido {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

  </style>
</head>

<body>

  <!-- BRILLITOS EN EL HEADER -->
  <header>
    <div class="sparkle" style="top:40%; left:20%"></div>
    <div class="sparkle" style="top:60%; left:70%"></div>
    <div class="sparkle" style="top:30%; left:50%"></div>

    <h1>Mich & Jhovas</h1>
    <p>“Dónde estemos juntos, será nuestro hogar.”</p>
  </header>

  <!-- FOTO DECORATIVA ARRIBA -->
  <img src="imagenes/imagenuno.png" class="fotoDecor fade">

  <section class="fade">
    <h2>Detalles del Evento</h2>
    <p><b>Fecha:</b> Jueves, 12 de Junio 2026</p>
    <p><b>Lugar:</b> Recoveco</p>
    <p><b>Hora:</b> 6:00 PM</p>
  </section>

  <section class="fade">
    <h2>Confirmación de Asistencia (RSVP)</h2>
    <p style="color:#a33; font-weight:bold; text-align:center; margin-bottom:20px;">Evento exclusivo para mayores de 13 años. No se permitirá el acceso a menores.</p>

    <form action="https://docs.google.com/forms/d/e/1FAIpQLSfLRp1QFLhXBeRs7wGuS1uq7rbSUhaXHviAjfcEs0r_EzQ1Fg/formResponse" method="POST" target="hidden_iframe" style="display:flex; flex-direction:column; gap:15px;">

      <input type="text" name="entry.716357449" placeholder="Nombre completo" required>

      <select name="entry.690625742" required>
        <option value="">¿Asistirás?</option>
        <option value="Sí asistiré ✨">Sí asistiré ✨</option>
        <option value="No podré asistir 😢">No podré asistir 😢</option>
      </select>

      <select name="entry.517237764" required>
        <option value="">¿Cuántos acompañantes?</option>
        <option value="0">0</option>
        <option value="1">1</option>
        <option value="2">2</option>
      </select>

      <textarea name="entry.1216312911" placeholder="Mensaje para los novios (opcional)" rows="4"></textarea>

      <button type="submit">Confirmar asistencia</button>
    </form>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
      const form = document.querySelector('form');
      const iframe = document.getElementById('hidden_iframe');

      iframe.onload = () => {
        form.style.display = 'none';

        const div = document.createElement('div');
        div.style.textAlign = 'center';
        div.style.padding = '30px';
        div.innerHTML = `
          <h2 style="font-family:'Cinzel',serif; color:#6a4e3c;">¡Gracias por confirmar! 💌</h2>
          <p>Tu respuesta se ha registrado correctamente.</p>

          <a href="https://www.google.com/maps/place/Paseo+de+la+Nogalera+1742,+Rincón+de+los+Nogales,+27054+Torreón,+Coah." target="_blank">
            <img src="imagenes/imagenmaps.png" style="width:150px; margin-top:20px; cursor:pointer; animation:latido 2s infinite;">
          </a>

          <p style="margin-top:10px; font-size:1.2rem; color:#6a4e3c;">Ubicación aquí 📍</p>
        `;

        document.querySelector('section:last-of-type').appendChild(div);
      };
    </script>

  </section>

  <!-- FOTO DECORATIVA ABAJO -->
  <img src="imagenes/imagendos.png" class="fotoDecor fade" style="margin-bottom:60px;">

</body>
</html>
